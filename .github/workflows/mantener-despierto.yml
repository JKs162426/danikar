name: Mantener despierto el servidor

# Render (plan gratuito) duerme el backend tras 15 min sin tráfico y tarda
# ~1 min en despertar: la primera clienta que llegaba veía la tienda
# cargando. Este workflow lo visita cada 5 min, solo en horario de la tienda.
#
# ¿Por qué no las 24 horas? Render da 750 horas gratis al MES por workspace,
# compartidas por todos los servicios gratuitos de la cuenta. Despierto 24/7
# gastaría ~744, y si se acaban Render suspende TODOS los servicios gratuitos
# hasta el mes siguiente (la tienda incluida). En horario son ~465 h.
#
# Por eso tampoco se hace ping desde el propio servidor: Render puede
# suspender un servicio gratuito por tráfico generado por él mismo.

on:
  schedule:
    # 11:00–01:59 UTC = 7:00–21:59 en Venezuela (UTC-4, sin horario de verano).
    # Minutos 2, 7, 12…: GitHub retrasa más las tareas del minuto 0.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 11-23,0-1 * * *"
  # Para probarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# No necesita leer ni escribir nada del repositorio.
permissions: {}

concurrency:
  group: mantener-despierto
  cancel-in-progress: false

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar /api/salud
        run: |
          # Si estaba dormido, despertar tarda ~1 min: de ahí el tiempo de espera.
          if curl --fail --silent --show-error --max-time 100 \
               --retry 2 --retry-delay 5 --retry-all-errors \
               https://danikar-backend.onrender.com/api/salud; then
            echo
          else
            # Aviso en vez de fallo: si Render se cae un rato, no llegan
            # decenas de correos de "workflow fallido".
            echo "::warning::El servidor no respondió. Revisa Render."
          fi
