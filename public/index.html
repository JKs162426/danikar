<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c81d6b" />

    <!-- SEO básico -->
    <title>Detalles DanKar</title>
    <meta
      name="description"
      content="Cintillos, lazos, pulseras y muchas cosas más. Hechos a mano en Pariaguán, Anzoátegui."
    />

    <!-- Open Graph: cómo se ve al compartir en WhatsApp, Instagram, Facebook -->
    <meta property="og:title" content="Detalles DanKar" />
    <meta
      property="og:description"
      content="Cintillos, lazos, pulseras y muchas cosas más. Hechos a mano en Pariaguán, Anzoátegui."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dankar.vercel.app" />
    <!-- Si cambias la imagen, cámbiale también el nombre: WhatsApp y
         Facebook guardan la vista previa en caché según la URL. -->
    <meta
      property="og:image"
      content="https://dankar.vercel.app/compartir-v2.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo de Detalles DanKar: lazos, cintillos y pulseras hechos a mano"
    />
    <meta property="og:site_name" content="Detalles DanKar" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:locale" content="es_VE" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>Activa JavaScript para ver la tienda.</noscript>
    <div id="root"></div>
  </body>
</html>
